spring.application.name=ams
server.port=8081

# datasource - allow overrides via environment variables (safer for different machines)
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/lojavirtual_db}
spring.datasource.username=${JDBC_DATABASE_USERNAME:postgres}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

spring.web.resources.static-locations=classpath:/static/,file:${user.dir}/uploads/
spring.mvc.static-path-pattern=/uploads/**

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
