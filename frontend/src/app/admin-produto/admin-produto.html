<section class="mx-auto max-w-3xl px-4 py-8">
  <div class="rounded-3xl border border-zinc-200 bg-white p-6 shadow-sm">
    <div class="mb-5">
      <p class="text-xs font-semibold uppercase tracking-[0.2em] text-red-600">Admin</p>
      <h2 class="mt-2 text-3xl font-bold text-zinc-800">Cadastrar produto</h2>
    </div>

    <div *ngIf="mensagem" class="mb-4 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">
      {{ mensagem }}
    </div>

    <form (ngSubmit)="salvar()" class="space-y-4">
      <div class="grid gap-4 md:grid-cols-2">
        <label class="block">
          <span class="mb-2 block text-sm font-medium text-zinc-700">Nome</span>
          <input [(ngModel)]="produto.nome" name="nome" class="w-full rounded-xl border border-zinc-300 px-3 py-2 text-zinc-800 outline-none focus:border-red-500" placeholder="Notebook Lenovo" />
        </label>

        <label class="block">
          <span class="mb-2 block text-sm font-medium text-zinc-700">Quantidade</span>
          <input type="number" min="0" [(ngModel)]="produto.quantidade" name="quantidade" class="w-full rounded-xl border border-zinc-300 px-3 py-2 text-zinc-800 outline-none focus:border-red-500" />
        </label>
      </div>

      <label class="block">
        <span class="mb-2 block text-sm font-medium text-zinc-700">Descrição</span>
        <textarea [(ngModel)]="produto.descritivo" name="descritivo" rows="4" class="w-full rounded-xl border border-zinc-300 px-3 py-2 text-zinc-800 outline-none focus:border-red-500" placeholder="Descreva o produto..."></textarea>
      </label>

      <div class="grid gap-4 md:grid-cols-2">
        <label class="block">
          <span class="mb-2 block text-sm font-medium text-zinc-700">Valor</span>
          <input type="number" min="0" step="0.01" [(ngModel)]="produto.valor" name="valor" class="w-full rounded-xl border border-zinc-300 px-3 py-2 text-zinc-800 outline-none focus:border-red-500" />
        </label>

        <label class="block">
          <span class="mb-2 block text-sm font-medium text-zinc-700">Valor promocional</span>
          <input type="number" min="0" step="0.01" [(ngModel)]="produto.valorPromo" name="valorPromo" class="w-full rounded-xl border border-zinc-300 px-3 py-2 text-zinc-800 outline-none focus:border-red-500" />
        </label>
      </div>

      <div class="grid gap-4 md:grid-cols-2">
        <label class="block">
          <span class="mb-2 block text-sm font-medium text-zinc-700">Imagem</span>
          <input [(ngModel)]="produto.imagem" name="imagem" class="w-full rounded-xl border border-zinc-300 px-3 py-2 text-zinc-800 outline-none focus:border-red-500" placeholder="/uploads/lenovo.jpg" />
        </label>

        <label class="block">
          <span class="mb-2 block text-sm font-medium text-zinc-700">Destaque</span>
          <select [(ngModel)]="produto.destaque" name="destaque" class="w-full rounded-xl border border-zinc-300 px-3 py-2 text-zinc-800 outline-none focus:border-red-500">
            <option [ngValue]="1">Sim</option>
            <option [ngValue]="0">Não</option>
          </select>
        </label>
      </div>

      <div class="flex justify-end gap-3 pt-2">
        <button type="button" class="rounded-xl border border-zinc-300 px-4 py-2 font-semibold text-zinc-700" (click)="router.navigateByUrl('/')">Voltar</button>
        <button type="submit" class="rounded-xl bg-red-600 px-5 py-2 font-semibold text-white shadow-sm transition hover:bg-red-700">Salvar produto</button>
      </div>
    </form>
  </div>
</section>
