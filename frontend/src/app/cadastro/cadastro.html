<section class="mx-auto max-w-2xl px-4 py-8">
 <div class="mb-8">
   <h3 class="text-3xl font-black text-zinc-800">Cadastro</h3>
 </div>

 <div *ngIf="mensagem.length > 0" class="mb-5 rounded-xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm font-medium text-emerald-700">
   {{ mensagem }}
 </div>

 <form class="space-y-5 rounded-2xl border border-zinc-200 bg-white p-6 shadow-sm">
   <div>
     <label for="txtUsuario" class="mb-2 block text-sm font-semibold text-zinc-700">Nome de usuário:</label>
     <input type="text" id="txtUsuario" class="w-full rounded-xl border border-zinc-300 bg-zinc-50 px-3 py-3 text-zinc-800 outline-none transition focus:border-red-400 focus:bg-white" name="txtUsuario" [(ngModel)]="obj.usuario" placeholder="Informe o seu nome de usuário" required>
   </div>

   <div>
     <label for="txtEmail" class="mb-2 block text-sm font-semibold text-zinc-700">E-mail:</label>
     <input type="email" id="txtEmail" class="w-full rounded-xl border border-zinc-300 bg-zinc-50 px-3 py-3 text-zinc-800 outline-none transition focus:border-red-400 focus:bg-white" name="txtEmail" [(ngModel)]="obj.email" placeholder="Informe o seu e-mail" required>
   </div>

   <div>
     <label for="txtSenha" class="mb-2 block text-sm font-semibold text-zinc-700">Senha:</label>
     <input type="password" id="txtSenha" class="w-full rounded-xl border border-zinc-300 bg-zinc-50 px-3 py-3 text-zinc-800 outline-none transition focus:border-red-400 focus:bg-white" name="txtSenha" [(ngModel)]="obj.senha" placeholder="Informe a sua senha" required>
   </div>

   <div class="pt-2">
     <button type="button" class="inline-flex items-center justify-center rounded-xl bg-red-600 px-5 py-3 text-base font-bold text-white shadow-sm transition hover:bg-red-700" (click)="gravar();">
       Cadastrar
     </button>
   </div>
 </form>
</section>
