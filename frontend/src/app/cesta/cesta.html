<section class="max-w-5xl mx-auto p-4 md:p-6">
  <div class="mb-6 flex flex-wrap items-center justify-between gap-4">
    <h3 class="text-2xl font-bold text-zinc-800">Sua cesta de compras</h3>
    <div class="flex items-center gap-3">
      <span class="rounded-full bg-red-600 px-3 py-1 text-sm font-semibold text-white">{{ itens.length }} item(s)</span>
      <button *ngIf="itens.length > 0" type="button" class="rounded-xl border border-red-200 bg-red-50 px-3 py-2 text-sm font-semibold text-red-700 transition hover:bg-red-600 hover:text-white" (click)="removerTudo()">
        Remover tudo
      </button>
    </div>
  </div>

  <div class="alert alert-info" *ngIf="mensagem.length>0">{{mensagem}}</div>

  <div *ngIf="itens.length === 0" class="rounded-2xl border border-dashed border-zinc-300 bg-white p-8 text-center text-zinc-500 shadow-sm">
    Sua cesta está vazia. Adicione alguns itens da vitrine.
  </div>

  <div *ngIf="itens.length > 0" class="overflow-hidden rounded-2xl border border-zinc-200 bg-white shadow-sm">
    <table class="w-full text-left text-sm text-zinc-700">
      <thead class="bg-zinc-100 text-zinc-700">
        <tr>
          <th class="p-4">Produto</th>
          <th class="p-4">Quantidade</th>
          <th class="p-4">Valor</th>
          <th class="p-4 text-right">Ações</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let obj of itens" class="border-t border-zinc-200 align-middle">
          <td class="p-4">
            <div class="flex items-center gap-3">
              <img [src]="getImagemUrl(obj.imagem)" class="h-16 w-16 rounded-xl object-cover bg-zinc-100" alt="{{obj.nome}}">
              <div>
                <div class="font-semibold text-zinc-800">{{obj.nome}}</div>
              </div>
            </div>
          </td>
          <td class="p-4">{{obj.quantidade}}</td>
          <td class="p-4 font-semibold text-zinc-800">{{ formatarMoeda(obj.valorTotal) }}</td>
          <td class="p-4 text-right">
            <button class="rounded-lg bg-red-600 px-3 py-2 text-sm font-semibold text-white hover:bg-red-700" (click)="remover(obj)">Remover</button>
          </td>
        </tr>
      </tbody>
      <tfoot>
        <tr class="bg-zinc-50">
          <td colspan="2" class="p-4 font-semibold text-zinc-800">Total</td>
          <td colspan="2" class="p-4 text-right text-lg font-bold text-red-600">{{ formatarMoeda(valorCesta) }}</td>
        </tr>
      </tfoot>
    </table>
  </div>

  <div class="mt-6 flex flex-wrap gap-3">
    <a href="vitrine" class="rounded-xl border border-zinc-300 bg-white px-4 py-2.5 font-semibold text-zinc-700 hover:bg-zinc-100">Continuar comprando</a>
    <button class="rounded-xl bg-emerald-600 px-4 py-2.5 font-semibold text-white hover:bg-emerald-700">Finalizar pedido</button>
  </div>
</section>
