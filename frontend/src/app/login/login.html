<section class="mx-auto max-w-5xl px-4 py-8">
  <div class="mb-8">
    <h3 class="text-3xl font-black text-zinc-800">Faça seu login</h3>
  </div>

  <div *ngIf="erro" class="mb-6 rounded-2xl border border-amber-200 bg-amber-100 px-4 py-3 text-sm font-medium text-amber-900">
    {{ erro }}
  </div>

  <div class="grid gap-8 rounded-3xl border border-zinc-200 bg-white p-6 shadow-sm md:grid-cols-2">
    <div>
      <p class="mb-5 text-zinc-600">Já tenho cadastro, informe seu e-mail e senha:</p>

      <div class="space-y-4">
        <div>
          <label class="mb-2 block text-sm font-semibold text-zinc-700">E-mail:</label>
          <input type="email" [(ngModel)]="email" class="w-full rounded-xl border border-zinc-300 bg-zinc-50 px-3 py-3 text-zinc-800 outline-none transition focus:border-red-400 focus:bg-white" placeholder="seuemail@exemplo.com">
        </div>

        <div>
          <label class="mb-2 block text-sm font-semibold text-zinc-700">Senha:</label>
          <input type="password" [(ngModel)]="senha" class="w-full rounded-xl border border-zinc-300 bg-zinc-50 px-3 py-3 text-zinc-800 outline-none transition focus:border-red-400 focus:bg-white" placeholder="••••••••">
        </div>

        <button type="button" class="w-full rounded-xl bg-red-600 px-4 py-3 text-base font-bold text-white shadow-sm transition hover:bg-red-700" (click)="entrar()">
          Entrar
        </button>
      </div>
    </div>

    <div class="flex flex-col justify-center rounded-2xl bg-zinc-50 p-5">
      <p class="mb-4 text-zinc-600">Ainda não tenho cadastro:</p>

      <a href="cadastro" class="mb-5 inline-flex items-center justify-center rounded-xl bg-red-600 px-4 py-3 text-sm font-bold text-white shadow-sm transition hover:bg-red-700">
        Faça seu novo cadastro
      </a>

      <p class="mb-3 text-zinc-600">Esqueci minha senha:</p>
      <a href="reenvio" class="inline-flex items-center justify-center rounded-xl border border-red-300 bg-red-50 px-4 py-3 text-sm font-bold text-red-700 transition hover:bg-red-600 hover:text-white">
        Esqueci minha senha
      </a>
    </div>
  </div>
</section>
